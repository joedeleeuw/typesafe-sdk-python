default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=10240]
      # G19: block AI-suffixed branches. --branch '' replaces the hook's
      # built-in main/master default so project-init's first commit lands.
      - id: no-commit-to-branch
        args: [--branch, "", --pattern, ".*[-_/]codex.*"]
  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.22.0
    hooks:
      - id: lychee
        args: [--offline, --no-progress, --include-fragments]
  - repo: local
    hooks:
      - id: new-test-files
        name: no new test files
        entry: check-new-tests
        language: system
        pass_filenames: false
        always_run: true
